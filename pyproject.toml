[project]
name = "cvrag"
version = "0.1.0"
description = "Multi-tenant CV analysis and RAG service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "django>=5.1,<6.0",
  "djangorestframework>=3.15.2",
  "dj-database-url>=2.3.0",
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  "celery[redis]>=5.4.0",
  "redis>=5.1.1",
  "python-dotenv>=1.0.1",
  "pymupdf>=1.24.13",
  "langchain>=0.3.7,<0.4",
  "langchain-community>=0.3.7,<0.4",
  "langchain-text-splitters>=0.3.2,<0.4",
  "langchain-postgres>=0.0.12",
  "langchain-openai>=0.2.8,<0.3",
  "django-filter>=24.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-django>=4.9.0",
  "ruff>=0.7.4"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"
